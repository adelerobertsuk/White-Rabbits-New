<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F1EA" id="theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="White Rabbits" />
  <meta name="description" content="Daily habits, a private journal, and a first-morning ritual. Say White Rabbits." />
  <title>White Rabbits</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-1024.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="stage">
    <div class="phone" id="app">
      <header class="chrome">
        <p class="kicker" id="header-kicker">Today</p>
        <button class="icon-btn" id="settings-open" aria-label="Open settings"></button>
      </header>

      <p class="preview-pill" id="preview-pill">Previewing the first of the month</p>

      <section class="view is-on" id="view-home" role="tabpanel" aria-labelledby="tab-home"></section>
      <section class="view" id="view-journal" role="tabpanel" aria-labelledby="tab-journal"></section>
      <section class="view" id="view-charms" role="tabpanel" aria-labelledby="tab-charms"></section>
      <section class="view" id="view-circle" role="tabpanel" aria-labelledby="tab-circle"></section>

      <nav class="tab-bar" role="tablist" aria-label="White Rabbits">
        <button id="tab-home" role="tab" aria-selected="true" aria-controls="view-home" data-tab="home" class="is-on">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="9" r="6.2"/><circle cx="9" cy="9" r="2.4"/></svg>
          </span>
          Today
        </button>
        <button id="tab-journal" role="tab" aria-selected="false" aria-controls="view-journal" data-tab="journal">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="2.5" width="11" height="13" rx="1.6"/><path d="M6.5 6h5M6.5 9h5M6.5 12h3"/></svg>
          </span>
          Journal
        </button>
        <button id="tab-charms" role="tab" aria-selected="false" aria-controls="view-charms" data-tab="charms">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 14c-2-4-1.2-8 1.4-9.5C6 2 8.2 1 9.4 4.2 11.2 1.6 14 3 12.2 6.2 15 7.4 15 11 12 14c-1.2 1.2-3.4 1.4-6 0z"/></svg>
          </span>
          Charms
        </button>
        <button id="tab-circle" role="tab" aria-selected="false" aria-controls="view-circle" data-tab="circle">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7.2" cy="9" r="4.1"/><circle cx="10.8" cy="9" r="4.1"/></svg>
          </span>
          Circle
        </button>
      </nav>

      <div class="overlay" id="ritual-overlay" hidden></div>
      <div class="sheet-layer" id="sheet-layer" hidden></div>
      <input class="visually-hidden" id="home-photo" type="file" accept="image/*" />
      <input class="visually-hidden" id="backup-import" type="file" accept="application/json,.json" />
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
